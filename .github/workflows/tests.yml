name: Sales Pipeline CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Purpose: Automatically run pytest on every push and pull request.
# This ensures that no broken code is merged into the main branch.

jobs:
  test:
    name: Run Pipeline Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the specified Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Cache pip packages to speed up future runs
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Run all pytest tests with verbose output
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      # Step 6: (Optional) Generate a pytest coverage summary
      - name: Test summary
        if: always()
        run: |
          echo "CI pipeline complete. Check the test output above."
